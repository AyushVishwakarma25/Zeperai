
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrackXai Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary': '#6A5AE0',
              'primary-hover': '#5A4AD8',
              'main': '#F9F9FB',
              'text-primary': '#111827',
              'text-secondary': '#6B7280',
              'sidebar-light': '#FFFFFF',
              'border-light': '#E5E7EB',
              'accent-green': '#10B981',
              // New colors for vertical dashboard
              'container-pink': '#FCEEEE',
              'ecommerce-black': '#111111',
              'marketing-purple': '#E1D4FA',
              'other-orange': '#FDBA74',
            },
            borderRadius: {
              'xl': '0.75rem',
              '2xl': '1rem',
              '3xl': '1.5rem',
            },
            boxShadow: {
              'glow-primary': '0 0 12px 2px rgba(106, 90, 224, 0.4)',
            },
            transitionTimingFunction: {
              'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
            },
            keyframes: {
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 12px 2px rgba(106, 90, 224, 0.4)' },
                '50%': { boxShadow: '0 0 20px 6px rgba(106, 90, 224, 0.6)' },
              },
              fadeInScaleUp: {
                'from': { opacity: 0, transform: 'scale(0.95)' },
                'to': { opacity: 1, transform: 'scale(1)' },
              }
            },
            animation: {
              'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
              'fade-in-scale-up': 'fadeInScaleUp 0.3s ease-out forwards',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@19.2.1",
    "react/": "https://aistudiocdn.com/react@19.2.1/",
    "react-dom": "https://aistudiocdn.com/react-dom@19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.19.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0",
    "@stripe/stripe-js": "https://esm.sh/@stripe/stripe-js@3.0.0"
  }
}
</script>
</head>
  <body class="bg-main">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
